project_id = "bmfxhgznttcnnlqloqzp"

[functions.api]
verify_jwt = false

# Called by pg_cron (pg_net) and by admins, never by a browser. Auth is the
# x-altercpa-sync-secret header checked in code — a Supabase JWT would be the
# wrong gate for a cron caller, and the function fails closed if the secret is
# unset.
[functions.altercpa-sync]
verify_jwt = false

# Same pattern: pg_cron caller, x-mex-sync-secret header checked in code.
[functions.mex-reconcile]
verify_jwt = false

# naturatherapy.mk mirror: pg_cron caller, x-web-sync-secret header checked in
# code (fails closed when WEB_SYNC_SECRET is unset). Reads the SHOP database as
# the read-only elyon_crm_reader role (WEB_SHOP_DB_URL) — never writes to it.
[functions.web-sync]
verify_jwt = false

# collabBox nightly sync + live bookings (20260942000900): pg_cron caller, x-collabbox-sync-secret
# header checked in code (fails closed when COLLABBOX_SYNC_SECRET is unset). Reads collabBox
# read-only (COLLABBOX_USER / COLLABBOX_PASS) - never writes to it.
[functions.collabbox-sync]
verify_jwt = false

# collabBox SHOPS reader (20260946000100–0300, owner 02.10.2026): pg_cron caller, the same
# x-collabbox-sync-secret header checked in code (fails closed). Reads the shops' collabBox read-only
# through its own allow-list (sales, goods/transfer/count docs, nightly stock) - never writes to it.
[functions.collabbox-shops]
verify_jwt = false
